---
# Checks the web app: the installed PWA with the viewer and editor.
name: App

on:
  # Every pull request, since the check is required
  pull_request: {}
  push:
    branches:
      - main
    paths:
      - .github/workflows/app.yml
      - bun.lock
      - mise.lock
      - mise.toml
      - package.json
      - packages/app/**
      - packages/card/**
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    uses: timmo001/workflows/.github/workflows/run-mise-task.yml@5ca45f8d789b67b2c3c14aea6062a379d6c37db1 # 20261123.0
    with:
      name: Check app
      task: app:check
      install-args: bun node
