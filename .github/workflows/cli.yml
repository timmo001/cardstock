---
# Checks the cardstock CLI, then builds its binary and smoke-tests it.
name: CLI

on:
  # Every pull request, since the check is required
  pull_request: {}
  push:
    branches:
      - main
    paths:
      - .github/workflows/cli.yml
      - bun.lock
      - mise.lock
      - mise.toml
      - package.json
      - packages/card/**
      - packages/cli/**
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    uses: timmo001/workflows/.github/workflows/run-mise-task.yml@db6f3692a31de24d2bee17e505dfd2bf3fd5a076 # 20261116.1
    with:
      name: Check CLI
      task: "cli:check ::: cli:build"
      install-args: bun node
      smoke-test: ./packages/cli/dist/cardstock --version
