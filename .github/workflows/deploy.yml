---
# Deploys the prod stage of the Alchemy stack in alchemy.run.ts from main: the
# cardstock Worker, which stores nothing, and the cardstock-docs Worker. The shared
# workflow runs `mise run deploy`; the Cloudflare token comes from
# stacks/github.ts.
name: Deploy

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy.yml
      - alchemy.run.ts
      - bun.lock
      - docs/**
      - mise.lock
      - mise.toml
      - package.json
      - packages/app/**
      - packages/card/**
      - packages/server/**
  workflow_dispatch: {}

# Deploys queue rather than cancel, so a stack update never stops halfway
concurrency:
  group: alchemy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    uses: timmo001/workflows/.github/workflows/deploy-alchemy.yml@5ca45f8d789b67b2c3c14aea6062a379d6c37db1 # 20261123.0
    with:
      smoke-check: |
        https://cards.timmo.dev 200
        https://cards.timmo.dev/api/health 200
        https://cardstock.timmo.dev 200
    secrets:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
