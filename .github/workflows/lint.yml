---
# Checks what every package shares: formatting, and the shared Actions,
# Markdown, YAML and JSON lints.
name: Lint

on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    uses: timmo001/workflows/.github/workflows/run-mise-task.yml@5ca45f8d789b67b2c3c14aea6062a379d6c37db1 # 20261123.0
    with:
      name: Format
      task: format:check
      install-args: bun node

  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@5ca45f8d789b67b2c3c14aea6062a379d6c37db1 # 20261123.0

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@5ca45f8d789b67b2c3c14aea6062a379d6c37db1 # 20261123.0

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@5ca45f8d789b67b2c3c14aea6062a379d6c37db1 # 20261123.0

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@5ca45f8d789b67b2c3c14aea6062a379d6c37db1 # 20261123.0
