# Cardstock's pinned tools and tasks. Each part is a private Bun workspace
# package under packages/, with its own lint, typecheck and test scripts; these
# tasks run them across every package. The hk pre-push hook runs the shared
# lint steps and every package's lint.
min_version = "2025.1.0"

[tools]
node = "26.13.1"
bun = "1.4.4"
pitchfork = "2.34.0"
# The linters the shared hk pre-push hook runs.
uv = "0.13.8"
# yamllint's PyYAML has no wheels for Python 3.15 yet, which mise lock needs.
python = "3.14.10"
"pipx:yamllint" = "1.38.0"
"npm:markdownlint-cli2" = "0.24.1"
actionlint = "1.7.12"
shellcheck = "0.11.0"

[tasks.install]
description = "Install dependencies"
run = "bun install --frozen-lockfile"
sources = ["package.json", "packages/*/package.json", "docs/package.json", "bun.lock"]

[tasks.test]
description = "Run every package's tests"
depends = ["install"]
run = "bun run --filter './packages/*' test"

[tasks.lint]
description = "Lint every package with the shared Oxlint rules"
depends = ["install"]
run = "bun run --filter './packages/*' lint"

[tasks.typecheck]
description = "Type-check every package and the Alchemy stacks"
depends = ["install"]
run = ["bun run --filter './packages/*' typecheck", "bun x tsc -p tsconfig.json"]

[tasks.format]
description = "Format source and configuration"
depends = ["install"]
run = "bun run format"

[tasks."format:check"]
description = "Check formatting without writing"
depends = ["install"]
run = "bun run format:check"

[tasks."card:check"]
description = "Lint, type-check and test the card package"
depends = ["install"]
dir = "packages/card"
run = ["bun run lint", "bun run typecheck", "bun run test"]

[tasks."card:preview"]
description = "Serve the renderer's preview page in the foreground; agents use serve:card"
depends = ["install"]
dir = "packages/card"
run = "bun run src/preview/serve.ts"

[tasks."serve:card"]
description = "Serve the renderer's preview page in the background through Pitchfork"
run = "pitchfork start card"

[tasks."serve:card:stop"]
description = "Stop the background preview page"
run = "pitchfork stop card"

[tasks."app:check"]
description = "Lint, type-check and test the web app"
depends = ["install"]
dir = "packages/app"
run = ["bun run lint", "bun run typecheck", "bun run test"]

[tasks."server:check"]
description = "Lint, type-check and test the server"
depends = ["install"]
dir = "packages/server"
run = ["bun run lint", "bun run typecheck", "bun run test"]

[tasks."cli:check"]
description = "Lint, type-check and test the CLI"
depends = ["install"]
dir = "packages/cli"
run = ["bun run lint", "bun run typecheck", "bun run test"]

[tasks."cli:build"]
description = "Build the CLI's binary into packages/cli/dist"
depends = ["install"]
dir = "packages/cli"
run = "bun run build"

[tasks.build]
description = "Build every package that has a build"
depends = ["install"]
run = "bun run --filter './packages/*' --if-present build"

[tasks."app:dev"]
description = "Build the web app and serve it in the foreground; agents use serve:app"
depends = ["install"]
dir = "packages/app"
run = "bun run dev"

[tasks."app:icons"]
description = "Write the app's Phosphor icons into src/icons.ts"
depends = ["install"]
dir = "packages/app"
run = "bun run icons"

[tasks."serve:app"]
description = "Build and serve the web app in the background through Pitchfork"
run = "pitchfork start app"

[tasks."serve:app:stop"]
description = "Stop the background web app"
run = "pitchfork stop app"

[tasks."docs:dev"]
description = "Run the docs dev server in the foreground; agents use serve:docs"
depends = ["install"]
dir = "docs"
# A reused Vite cache makes every page fail to resolve Astro's ClientRouter script
run = ["rm -rf .blume/.cache/vite", "bun run dev"]

[tasks."docs:build"]
description = "Build the docs site"
depends = ["install"]
dir = "docs"
run = "bun run build"

[tasks."docs:check"]
description = "Check the docs site's content and links"
depends = ["install"]
dir = "docs"
run = "bun run check"

[tasks."docs:brand"]
description = "Render the docs site's PNG logo, touch icon and the social preview from the logo"
depends = ["install"]
dir = "docs"
run = "bun run brand"

[tasks."serve:docs"]
description = "Start the docs dev server in the background through Pitchfork"
run = "pitchfork start docs"

[tasks."serve:docs:stop"]
description = "Stop the background docs dev server"
run = "pitchfork stop docs"

[tasks.check]
description = "Lint, type-check, verify formatting and check the docs"
depends = ["lint", "typecheck", "format:check", "docs:check"]

[tasks.plan]
description = "Build the app and docs, then show what deploying the prod stage would change"
depends = ["build", "docs:build"]
run = "bun alchemy plan --stage prod"

[tasks.deploy]
description = "Build the app and docs, then deploy the prod stage with Alchemy"
depends = ["build", "docs:build"]
run = "bun alchemy deploy --stage prod --yes"

[tasks."deploy:github"]
description = "Mint CI's Cloudflare token into the repository's secrets"
depends = ["install"]
run = "bun alchemy deploy --config stacks/github.ts --stage prod --yes"
