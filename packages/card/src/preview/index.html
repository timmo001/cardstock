<!doctype html>
<!-- The renderer's preview page, for working on designs and effects. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cardstock preview</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: radial-gradient(circle at 50% 38%, #f3eee6, #d9d1c5 75%);
        color: #2b2722;
        font:
          14px system-ui,
          sans-serif;
      }

      canvas {
        position: relative;
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        outline: none;
      }

      /* The link preview image: exactly 1200 by 630, with nothing else */
      body[data-og] canvas {
        width: 1200px;
        height: 630px;
      }

      body[data-og] form {
        display: none;
      }

      form {
        position: fixed;
        top: 12px;
        left: 12px;
        display: flex;
        gap: 8px;
      }
    </style>
  </head>
  <body>
    <form>
      <select name="design" aria-label="Design"></select>
      <select name="effect" aria-label="Effect"></select>
    </form>
    <canvas
      tabindex="0"
      aria-label="The card. Tap or press Enter to open it."
    ></canvas>
    <script type="module" src="./preview.ts"></script>
  </body>
</html>
